name: Docker Build Publish

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
  release:
    types:
      - published
permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
      id-token: write
    uses: Onebrief/actions/.github/workflows/reusable-docker-build.yml@1a92562b1135e279bccb31afb7ad4ddbf8c27775 # main
    with:
      repository: ob/docling-ob
      dockerfile: Dockerfile
      context: .
    secrets: inherit
